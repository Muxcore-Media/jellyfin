name: Release
on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v4
        with:
          path: jellyfin
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build binaries
        working-directory: ./jellyfin
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/jellyfin-linux-amd64 ./cmd/module
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/jellyfin-linux-arm64 ./cmd/module
      - name: Lowercase image name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./jellyfin
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/jellyfin:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/jellyfin:latest
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin/dist/*
          generate_release_notes: true
