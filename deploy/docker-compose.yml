services:
  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  jellyfin:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9475:9475"
      - "8475:8475"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: jellyfin
      JELLYFIN_GRPC_ADDR: ":9475"
      JELLYFIN_HTTP_ADDR: ":8475"
      JELLYFIN_BASE_URL: "${JELLYFIN_BASE_URL:-}"
      JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"
      JELLYFIN_WEBHOOK_SECRET: "${JELLYFIN_WEBHOOK_SECRET:-}"
      USERDATA_SYNC: "${USERDATA_SYNC:-0}"
      USERDATA_SYNC_INTERVAL_SECONDS: "${USERDATA_SYNC_INTERVAL_SECONDS:-300}"
      USERDATA_LOCAL_URL: "${USERDATA_LOCAL_URL:-}"
      USERDATA_PUSH_TO_JELLYFIN: "${USERDATA_PUSH_TO_JELLYFIN:-0}"
      JELLYFIN_DATA_DIR: /var/lib/muxcore-jellyfin
    volumes:
      - jellyfin-data:/var/lib/muxcore-jellyfin
    depends_on:
      core:
        condition: service_healthy

volumes:
  jellyfin-data:
